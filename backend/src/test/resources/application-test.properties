spring.datasource.url=jdbc:h2:mem:relayra-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
relayra.auth.jwt-signing-key=test-signing-key-that-is-long-enough-32b
relayra.auth.access-token-ttl-seconds=900
relayra.auth.refresh-token-ttl-seconds=2592000
relayra.auth.secure-cookies=false
