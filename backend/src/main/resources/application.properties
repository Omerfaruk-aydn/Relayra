spring.application.name=relayra-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/relayra}
spring.datasource.username=${DATABASE_USERNAME:relayra}
spring.datasource.password=${DATABASE_PASSWORD:relayra}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

relayra.auth.jwt-signing-key=${JWT_SIGNING_KEY:CHANGE_ME_GENERATE_A_STRONG_SECRET_AT_LEAST_32_BYTES}
relayra.auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL:900}
relayra.auth.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL:2592000}
relayra.auth.secure-cookies=${SECURE_COOKIES:false}
