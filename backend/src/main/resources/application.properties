spring.application.name=relayra-backend
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/relayra}
spring.datasource.username=${DATABASE_USERNAME:relayra}
spring.datasource.password=${DATABASE_PASSWORD:relayra}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [requestId=%X{requestId}] - %msg%n

spring.datasource.hikari.maximum-pool-size=${DATASOURCE_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DATASOURCE_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DATASOURCE_POOL_CONN_TIMEOUT_MS:5000}

spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:11MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:11MB}

relayra.auth.jwt-signing-key=${JWT_SIGNING_KEY:CHANGE_ME_GENERATE_A_STRONG_SECRET_AT_LEAST_32_BYTES}
relayra.auth.access-token-ttl-seconds=${ACCESS_TOKEN_TTL:900}
relayra.auth.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL:2592000}
relayra.auth.secure-cookies=${SECURE_COOKIES:false}
